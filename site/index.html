<!doctype html>
<html lang="<!--LANG-->">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080b" />
    <link rel="icon" href="data:," />
    <!--HEAD-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root{--bg:#08080b;--ink:#f3efe6;--ink-2:#c9c4b9;--dim:#938e84;--red:#ff6a45;--teal:#4fe8bd;--ice:#a9b4ff;
        --light:#ffdca8;--line:rgba(255,226,180,.16);--glass:rgba(16,15,18,.62);
        --serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
        color-scheme:dark}
      *{box-sizing:border-box}
      html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;overflow:hidden}
      a{color:inherit}
      button{font:inherit;color:inherit;cursor:pointer}
      :focus-visible{outline:2px solid var(--light);outline-offset:2px}
      [hidden]{display:none!important}
      .loss{--tone:var(--red)}.blocked{--tone:var(--teal)}.other{--tone:var(--ice)}

      /* 背景：暗房走廊只做氛围，切换事件时镜头向前推 */
      .world{position:fixed;inset:0;overflow:hidden;perspective:1000px;perspective-origin:50% 42%}
      .scene{position:absolute;left:50%;top:42%;width:0;height:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.22,.8,.26,1)}
      .plane{position:absolute;transform-origin:0 0}
      .floor{background:linear-gradient(90deg,#120f14,#2b2630 50%,#120f14)}
      .ceil{background:#0e0c11}
      .wall{background:linear-gradient(180deg,#121014,#231f27 58%,#121014)}
      .rib{position:absolute;border:1px solid rgba(255,226,180,.09)}
      .lamp{position:absolute;width:320px;height:12px;margin-left:-160px;background:var(--light);border-radius:2px;box-shadow:0 0 36px 12px rgba(255,220,168,.5)}
      .veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(8,8,11,.5) 0,rgba(8,8,11,.72) 60%,rgba(8,8,11,.92) 100%)}

      .app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
      /* 行号写死：手机上总览栏隐藏时，胶片不会挤进中间那行 */
      .bar{grid-row:1}.band{grid-row:2}.stage{grid-row:3}.film{grid-row:4}
      .bar{display:flex;align-items:center;justify-content:space-between;padding:13px 28px}
      .mark{appearance:none;border:0;background:none;padding:0;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.05em}
      /* 总览四格：封面完整显示，进入事件后收成细栏 */
      .band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 28px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(14,13,16,.66);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
      .cell4{min-width:0;padding:13px 16px 12px;border-left:1px solid var(--line)}
      .cell4:first-child{border-left:0}
      .cell4 i{display:block;width:26px;height:3px;border-radius:2px;margin-bottom:9px;background:var(--bar)}
      .cell4 b{display:block;font-family:var(--mono);font-weight:500;font-size:clamp(22px,2.5vw,32px);line-height:1.1;white-space:nowrap;color:var(--num);font-variant-numeric:tabular-nums}
      .cell4 span{display:block;margin-top:5px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
      .band.slim{margin-bottom:10px;border-radius:9px}
      .band.slim .cell4{display:flex;align-items:baseline;gap:8px;padding:6px 13px}
      .band.slim .cell4 i{display:none}
      .band.slim .cell4 b{font-size:15px}
      .band.slim .cell4 span{margin:0;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .top-r{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:13px}
      .top-r a{color:var(--dim);text-decoration:none}
      .top-r a:hover{color:var(--ink)}
      .top-r a[aria-current="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
      .top-r .sep{width:1px;height:14px;background:var(--line)}

      /* 主舞台：大画幅作品 + 文字 */
      .stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:clamp(24px,3.4vw,52px);align-items:center;padding:0 clamp(64px,6vw,92px) 14px}
      .art{position:relative;min-width:0;perspective:1400px;animation:artIn .7s cubic-bezier(.22,.8,.26,1) both}
      @keyframes artIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
      .piece{position:relative;transform:rotateY(4deg);transform-origin:left center;box-shadow:0 0 120px 10px rgba(255,220,168,.13),0 34px 80px rgba(0,0,0,.6);border:1px solid rgba(255,226,180,.3);background:#0d0c10}
      .piece::before{content:"";position:absolute;left:12%;right:12%;top:-22px;height:6px;border-radius:3px;background:var(--light);box-shadow:0 20px 70px 22px rgba(255,220,168,.24),0 0 18px 3px rgba(255,220,168,.55)}
      .piece .pic{display:block;width:100%;height:auto;aspect-ratio:960 / 690;max-height:calc(100dvh - 330px);object-fit:contain;background:#0b0a0e}
      .tag{position:absolute;left:20px;bottom:15px;right:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;text-shadow:0 2px 16px rgba(0,0,0,.8)}
      .tag b{font-family:var(--serif);font-weight:900;font-size:clamp(30px,3.8vw,52px);line-height:1;color:var(--tone,var(--ink))}
      .tag b.long{font-size:clamp(22px,2.4vw,32px)}
      .plate{position:absolute;right:14px;bottom:14px;max-width:62%;padding:7px 11px 6px;background:rgba(243,239,230,.93);color:#17140f;box-shadow:0 6px 20px rgba(0,0,0,.5)}
      .plate b{display:block;font-family:var(--mono);font-weight:500;font-size:13px;line-height:1.3;letter-spacing:.09em}
      .plate span{display:block;margin-top:1px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:#5f594e}
      .cap{margin:9px 2px 0;font-size:13px;line-height:1.5;color:var(--ink-2)}

      .text{min-width:0;max-height:100%;overflow-y:auto;padding:20px 24px;background:var(--glass);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);overscroll-behavior:contain;animation:textIn .55s ease both .12s}
      @keyframes textIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.art,.text{animation:none}.scene{transition:none}}
      .meta{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--dim)}
      .meta em{font-style:normal;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 6px}
      .meta em.unknown{color:var(--red);border-color:currentColor}
      .text h2{margin:9px 0 0;font-family:var(--serif);font-weight:700;font-size:clamp(19px,1.9vw,25px);line-height:1.42;text-wrap:pretty}
      .note{margin-top:6px;font-size:13.5px;line-height:1.6;color:var(--dim)}
      .sum{margin:11px 0 0;font-size:14.5px;line-height:1.8;color:var(--ink-2)}
      .human{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.65}
      .human b{display:block;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--dim)}
      details{margin-top:10px;font-size:14px;line-height:1.75;color:var(--ink-2)}
      summary{cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
      details ol{margin:7px 0 0;padding-left:20px}
      details p{margin:7px 0 0}
      .src{margin-top:10px;display:flex;flex-wrap:wrap;gap:3px 13px;font-size:12.5px;color:var(--dim)}
      .src a{text-underline-offset:3px}
      .acts{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12.5px}
      .acts a{color:var(--light);text-underline-offset:3px}

      /* 封面 */
      .text.cover{background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
      .text.cover h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(40px,5.4vw,76px);line-height:1.15;letter-spacing:.04em}
      .sub{margin-top:8px;font-size:clamp(16px,1.6vw,20px);color:var(--ink-2)}
      .typed{margin-top:12px;min-height:1.7em;font-size:15px;color:var(--dim)}
      .typed::after{content:"|";margin-left:2px;animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .go{appearance:none;margin-top:18px;padding:9px 20px;border:1px solid var(--light);border-radius:6px;background:var(--light);color:#17120a;font-weight:700;font-size:14.5px}

      .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;appearance:none;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--glass);font-family:var(--mono);font-size:16px}
      .arrow:disabled{opacity:.25;cursor:default}
      .arrow.p{left:12px}.arrow.n{right:12px}

      /* 胶片时间轴：缩略图就是作品本身 */
      .film{position:relative;border-top:1px solid var(--line);background:rgba(8,8,11,.72)}
      .strip{display:flex;gap:6px;overflow-x:auto;padding:22px 28px 9px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
      .cell{position:relative;flex:none;width:128px;text-decoration:none;opacity:.55;transition:opacity .2s}
      .cell:hover{opacity:.85}
      .cell[aria-current="true"]{opacity:1}
      .cell .pic{display:block;width:128px;height:64px;object-fit:cover;border:1px solid rgba(255,255,255,.1);background:#0b0a0e}
      .cell[aria-current="true"] .pic{border-color:var(--tone);box-shadow:0 0 16px color-mix(in srgb,var(--tone) 50%,transparent)}
      .cell span{display:block;margin-top:4px;font-size:11.5px;line-height:1.3;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .cell i{position:absolute;top:-17px;left:0;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim)}

      .error{grid-column:1 / -1;text-align:center;color:var(--ink-2)}
      @media (max-width:820px){
        html,body{overflow:hidden}
        .bar{padding:10px 14px;gap:10px}
        .band{grid-template-columns:repeat(2,minmax(0,1fr));margin:0 14px 10px}
        .cell4{padding:10px 12px;border-top:1px solid var(--line)}
        .cell4:nth-child(-n+2){border-top:0}
        .cell4:nth-child(3){border-left:0}
        .cell4 b{font-size:20px}
        .cell4 span{font-size:11.5px}
        .band.slim{display:none}
        .stage{display:block;overflow-y:auto;padding:0 14px 54px}
        .piece{transform:none}
        .piece .pic{max-height:36vh}
        .top-r .wide{display:none}
        .tag{left:13px;right:13px;bottom:10px}
        .plate{right:9px;bottom:9px;padding:5px 8px 4px}
        .plate b{font-size:11px}
        .text{margin-top:12px;max-height:none;overflow:visible;padding:14px 15px}
        .text.cover{padding:0}
        /* 手机上左右键放在胶片两端，不压正文 */
        .arrow{position:fixed;top:auto;bottom:26px;transform:none;width:34px;height:34px;background:rgba(8,8,11,.92)}
        .arrow.p{left:8px}.arrow.n{right:8px}
        .strip{padding:19px 50px 7px}
        .cell{width:96px}.cell .pic{width:96px;height:44px}
      }
    </style>
  </head>
  <body>
    <div class="world" aria-hidden="true"><div class="scene" id="scene"></div><div class="veil"></div></div>
    <div class="app">
      <header class="bar">
        <button type="button" class="mark" id="mark"></button>
        <nav class="top-r" id="top"></nav>
      </header>
      <section class="band" id="band" aria-label="Summary"></section>
      <main class="stage" id="stage"></main>
      <nav class="film" id="film"><div class="strip" id="strip"></div></nav>
    </div>

    <script src="<!--ROOT-->art.js"></script>
    <script>
      /* 构建时写入：语言、到站点根目录的相对路径、全部数据 */
      var BOOT = /*BOOT*/null;
      var UI = {
        zh: { lang: "zh-CN", title: "AI 乱纪元", sub: "AI 时代安全大事件", typed: ["记录金钱、失控和突破想象的时刻。", "每一条都写清楚：人，还在不在。"], go: "从第一件开始",
          human: "人在哪里", more: "攻击链路和说明", cover: "开篇", prev: "上一条", next: "下一条",
          all: "全部事件", submit: "提交事件", page: "单独页面", fix: "纠错",
          bandTotal: function (n, c) { return "本站收录 " + n + " 起 AI 相关单案的转出合计，其中 AI 已确认约 " + c + "；不代表全球总损失"; }, bandRun: function (s) { return "本站收录累计 / 全部 ≈ " + s; }, bandYear: function (y) { return "FBI IC3：" + y + " 年美国提到 AI 的投诉损失（自报）"; }, bandYearS: function (y) { return "FBI IC3 " + y + "（自报）"; }, bandTop: function (n, a) { return "最大单案：" + n + "，转出约 " + a; }, bandTopS: "最大单案", bandOut: function (n) { return n + "被盗（自估），AI 参与未明，不计入合计"; }, bandOutS: function (n) { return n + "，不计入合计"; },
          ev: { confirmed: "AI 已确认", assessed: "AI 研判", self_reported: "AI 自报", unknown: "AI 参与未明" },
          occurred: "发生 ", disclosed: "披露 " },
        en: { lang: "en", title: "AI Chaotic Era", sub: "Major security events of the AI era", typed: ["Money, loss of control, and what nobody expected.", "Each entry says it plainly: were humans still there?"], go: "Start with the first",
          human: "Where the humans were", more: "Attack trace and notes", cover: "Intro", prev: "Previous", next: "Next",
          all: "All events", submit: "Submit an event", page: "Permalink", fix: "Report a correction",
          bandTotal: function (n, c) { return "Moved in the " + n + " AI-linked cases recorded here, about " + c + " with AI confirmed. Not a global total"; }, bandRun: function (s) { return "recorded so far / all ≈ " + s; }, bandYear: function (y) { return "FBI IC3: US complaints mentioning AI in " + y + " (self-reported)"; }, bandYearS: function (y) { return "FBI IC3 " + y + " (self-reported)"; }, bandTop: function (n, a) { return "Largest case: " + n + ", about " + a + " moved"; }, bandTopS: "largest case", bandOut: function (n) { return n + " theft (own estimate), AI role unknown, not in the total"; }, bandOutS: function (n) { return n + ", not in the total"; },
          ev: { confirmed: "AI confirmed", assessed: "AI assessed", self_reported: "AI self-reported", unknown: "AI role unknown" },
          occurred: "Occurred ", disclosed: "Disclosed " }
      };
      var STEP = 1000, H = 720, W = 1280, REPO = "https://github.com/chokebit/AISec-Timeline";
      var ORDER = [], lang = BOOT ? BOOT.lang : "en", ROOT = BOOT ? BOOT.root : "", idx = -1, typeTimer = null;

      /* 英文首页：选过中文，或第一次来且浏览器是中文，就转到中文版 */
      (function () {
        if (!BOOT || lang !== "en") return;
        var saved = null;
        try { saved = localStorage.getItem("aisec-lang"); } catch (e) {}
        if (saved === "zh" || (!saved && /^zh/i.test(navigator.language || ""))) location.replace(ROOT + "zh/" + location.hash);
      })();
      function $(id) { return document.getElementById(id); }
      function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
      function sortDate(e) { return e.occurred || e.disclosed; }
      function toneOf(e) { return AISecArt.tone(e); }
      function home(l) { return ROOT + (l === "zh" ? "zh/" : "") || "./"; }
      function pageOf(e) { return home(lang) + "events/" + e.id + "/"; }
      function isCase(e) { return e.outcome === "loss" && e.ai_evidence !== "unknown"; }
      function usd(m) {
        if (lang === "zh") {
          if (m >= 100) return "$" + (m / 100).toFixed(2) + " 亿";
          return "$" + (m >= 10 ? Math.round(m * 10) * 10 : Math.round(m * 100)).toLocaleString("en-US") + " 万";
        }
        if (m >= 1) return "$" + m.toLocaleString("en-US", { maximumFractionDigits: m >= 100 ? 0 : m >= 10 ? 1 : 2 }) + "M";
        return "$" + Math.round(m * 1000) + "K";
      }
      function sumOf(list) { return list.reduce(function (s, e) { return s + e.usd_m; }, 0); }
      function dateText(d) {
        var p = d.split("-");
        if (lang === "zh") return p[0] + " 年" + (p[1] ? " " + Number(p[1]) + " 月" : "") + (p[2] ? " " + Number(p[2]) + " 日" : "");
        var m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return (p[2] ? Number(p[2]) + " " : "") + (p[1] ? m[Number(p[1]) - 1] + " " : "") + p[0];
      }
      function dateLine(e) {
        var t = UI[lang], o = [];
        if (e.occurred) o.push(t.occurred + dateText(e.occurred));
        if (e.disclosed && e.disclosed !== e.occurred) o.push(t.disclosed + dateText(e.disclosed));
        return o.join(" · ");
      }

      /* 配图是构建时预先生成的图片；图片缺失时（比如刚加的事件）现场用 art.js 画 */
      function pic(i, thumb) {
        var img = new Image(), id = i < 0 ? "cover" : ORDER[i].id;
        img.className = "pic";
        img.alt = "";
        img.decoding = "async";
        if (thumb) { img.loading = "lazy"; img.width = 256; img.height = 128; }
        else { img.width = 960; img.height = 690; }
        img.onerror = function () {
          var cv = document.createElement("canvas");
          cv.className = "pic";
          cv.width = thumb ? 256 : 960; cv.height = thumb ? 128 : 690;
          var full = document.createElement("canvas");
          full.width = 960; full.height = 690;
          if (i < 0) AISecArt.cover(full); else AISecArt.draw(full, ORDER[i]);
          var h = full.width * cv.height / cv.width;
          cv.getContext("2d").drawImage(full, 0, (full.height - h) / 2, full.width, h, 0, 0, cv.width, cv.height);
          if (img.parentNode) img.parentNode.replaceChild(cv, img);
        };
        img.src = ROOT + "art/" + id + (thumb ? "-t" : "") + ".webp";
        return img;
      }

      function buildScene() {
        var L = (ORDER.length + 6) * STEP, html = "";
        var flat = "width:" + W + "px;height:" + L + "px;";
        var side = "width:" + L + "px;height:" + H + "px;";
        html += '<div class="plane floor" style="' + flat + "transform:translate3d(" + (-W / 2) + "px," + H / 2 + 'px,0) rotateX(-90deg)"></div>';
        html += '<div class="plane ceil" style="' + flat + "transform:translate3d(" + (-W / 2) + "px," + (-H / 2) + 'px,0) rotateX(-90deg)"></div>';
        html += '<div class="plane wall" style="' + side + "transform:translate3d(" + (-W / 2) + "px," + (-H / 2) + 'px,0) rotateY(90deg)"></div>';
        html += '<div class="plane wall" style="' + side + "transform:translate3d(" + W / 2 + "px," + (-H / 2) + 'px,0) rotateY(90deg)"></div>';
        for (var k = 0; k < ORDER.length + 6; k++) {
          html += '<div class="rib" style="left:' + (-W / 2) + "px;top:" + (-H / 2) + "px;width:" + W + "px;height:" + H + "px;transform:translateZ(" + (-k * STEP) + "px) rotateZ(" + ((k % 2 ? 1 : -1) * Math.pow(k / (ORDER.length + 6), 2) * 3).toFixed(2) + 'deg)"></div>';
          html += '<div class="lamp" style="left:0;top:' + (-H / 2 + 4) + "px;transform:translateZ(" + (-k * STEP - 500) + 'px) rotateX(90deg)"></div>';
        }
        $("scene").innerHTML = html;
      }

      /* 胶片格是真链接：搜索引擎能顺着找到每个事件页，点击时留在展馆里 */
      function buildStrip() {
        var seen = {};
        $("strip").innerHTML = ORDER.map(function (e, i) {
          var y = sortDate(e).slice(0, 4), first = !seen[y];
          seen[y] = 1;
          return '<a class="cell ' + toneOf(e) + '" data-i="' + i + '" href="' + esc(pageOf(e)) + '" title="' + esc(e[lang].title) + '">' + (first ? "<i>" + y + "</i>" : "") +
            "<span>" + esc(e[lang].short) + "</span></a>";
        }).join("");
        [].forEach.call($("strip").children, function (a, i) { a.insertBefore(pic(i, true), a.lastChild); });
      }

      function coverHtml() {
        var t = UI[lang];
        return '<div class="art" id="art"><div class="piece"></div></div>' +
          '<section class="text cover"><h1>' + esc(t.title) + '</h1><div class="sub">' + esc(t.sub) + '</div><div class="typed" id="typed"></div>' +
          '<button type="button" class="go" data-go="1">' + esc(t.go) + " →</button></section>";
      }

      /* 四格的数字都从数据算出 */
      function bandCells(running) {
        var t = UI[lang], cases = ORDER.filter(isCase), slim = idx >= 0;
        var top = cases.reduce(function (a, e) { return e.usd_m > a.usd_m ? e : a; });
        var outside = ORDER.filter(function (e) { return e.ai_evidence === "unknown"; }).reduce(function (a, e) { return e.usd_m > a.usd_m ? e : a; });
        var confirmed = sumOf(cases.filter(function (e) { return e.ai_evidence === "confirmed"; }));
        var cells = [
          { bar: "#ff6a45", num: "#ff8a66", id: "bandTotal", val: "≈ " + usd(slim ? running : sumOf(cases)), label: slim ? t.bandRun(usd(sumOf(cases))) : t.bandTotal(cases.length, usd(confirmed)) },
          { bar: "#ff6a45", num: "#ff8a66", val: usd(top.usd_m), label: slim ? t.bandTopS : t.bandTop(top[lang].short, top[lang].amount) }
        ];
        var yearly = ORDER.filter(function (e) { return e.outcome === "aggregate"; }).pop();
        if (yearly) cells.push({ bar: "#a9b4ff", num: "var(--ink)", val: yearly[lang].amount, label: slim ? t.bandYearS(sortDate(yearly).slice(0, 4)) : t.bandYear(sortDate(yearly).slice(0, 4)) });
        cells.push({ bar: "#9a8fe0", num: "var(--ink)", val: outside[lang].amount, label: slim ? t.bandOutS(outside[lang].short) : t.bandOut(outside[lang].short) });
        return cells;
      }
      function renderBand(running) {
        var band = $("band"), slim = idx >= 0;
        band.className = "band" + (slim ? " slim" : "");
        band.innerHTML = bandCells(running).map(function (c) {
          return '<div class="cell4" style="--bar:' + c.bar + ";--num:" + c.num + '"><i></i><b' + (c.id ? ' id="' + c.id + '"' : "") + ">" + esc(c.val) + "</b><span>" + esc(c.label) + "</span></div>";
        }).join("");
      }

      function caseHtml(e) {
        var l = e[lang], t = UI[lang];
        var src = e.sources.map(function (s) {
          return '<a href="' + esc(encodeURI(s.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(s.name) + " ↗</a>";
        }).join("");
        return '<div class="art ' + toneOf(e) + '" id="art"><div class="piece"><div class="tag"><b class="' + (e.usd_m === null ? "long" : "") + '">' + esc(l.amount) + '</b></div><div class="plate"><b>' + esc(e.plate) + "</b><span>" + esc(sortDate(e).split("-").slice(0, 2).join(".")) + '</span></div></div>' + (l.art_note ? '<p class="cap">' + esc(l.art_note) + "</p>" : "") + "</div>" +
          '<section class="text"><div class="meta"><span>' + esc(dateLine(e)) + '</span><em class="' + esc(e.ai_evidence) + '">' + esc(t.ev[e.ai_evidence]) + "</em></div>" +
          "<h2>" + esc(l.title) + "</h2>" +
          '<div class="note">' + esc(l.amount_note) + "</div>" +
          '<div class="human"><b>' + esc(t.human) + "</b>" + esc(l.human_role) + "</div>" +
          '<p class="sum">' + esc(l.summary) + "</p>" +
          "<details><summary>" + esc(t.more) + "</summary><ol>" + l.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol><p><b>" + esc(l.takeaway_label) + "</b> " + esc(l.takeaway) + "</p></details>" +
          '<div class="src">' + src + "</div>" +
          '<div class="acts"><a href="' + esc(pageOf(e)) + '">' + esc(t.page) + ' →</a><a href="' + REPO + "/issues/new?template=correction.yml&event=" + encodeURIComponent(e.id) + '" target="_blank" rel="noopener noreferrer">' + esc(t.fix) + " ↗</a></div></section>";
      }

      function render() {
        var t = UI[lang], st = $("stage");
        st.innerHTML = (idx < 0 ? coverHtml() : caseHtml(ORDER[idx])) +
          '<button type="button" class="arrow p" data-go="-1" aria-label="' + esc(t.prev) + '"' + (idx < 0 ? " disabled" : "") + ">←</button>" +
          '<button type="button" class="arrow n" data-go="1" aria-label="' + esc(t.next) + '"' + (idx >= ORDER.length - 1 ? " disabled" : "") + ">→</button>";
        var piece = st.querySelector(".piece");
        piece.insertBefore(pic(idx), piece.firstChild);
        $("scene").style.transform = "translateZ(" + (idx + 1) * STEP + "px)";
        var cells = $("strip").children, strip = $("strip");
        for (var k = 0; k < cells.length; k++) cells[k].setAttribute("aria-current", k === idx ? "true" : "false");
        if (idx >= 0) {
          var c = cells[idx];
          strip.scrollTo({ left: c.offsetLeft - strip.clientWidth / 2 + c.offsetWidth / 2, behavior: "smooth" });
        } else strip.scrollTo({ left: 0, behavior: "smooth" });
        history.replaceState(null, "", location.pathname + location.search + (idx >= 0 ? "#" + ORDER[idx].id : ""));
        tallyTo(sumOf((idx < 0 ? ORDER : ORDER.slice(0, idx + 1)).filter(isCase)));
        if (idx < 0) typeLine(); else clearTimeout(typeTimer);
        if (idx + 1 < ORDER.length) new Image().src = ROOT + "art/" + ORDER[idx + 1].id + ".webp";
      }

      function typeLine() {
        clearTimeout(typeTimer);
        var lines = UI[lang].typed, li = 0, ch = 0, el = $("typed");
        (function tick() {
          if (!el.isConnected) return;
          var text = lines[li];
          el.textContent = text.slice(0, ch);
          if (ch < text.length) { ch++; typeTimer = setTimeout(tick, 70); }
          else typeTimer = setTimeout(function () { ch = 0; li = (li + 1) % lines.length; tick(); }, 1800);
        })();
      }

      /* 累计数字随时间线往上涨 */
      var shown = 0, tallyRaf = null;
      function tallyTo(v) {
        cancelAnimationFrame(tallyRaf);
        renderBand(shown);
        var from = shown, t0 = performance.now(), reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        (function step(now) {
          var u = reduce ? 1 : Math.min(1, ((now || t0) - t0) / 650), e = 1 - Math.pow(1 - u, 3);
          shown = from + (v - from) * e;
          if ($("bandTotal") && idx >= 0) $("bandTotal").textContent = "≈ " + usd(shown);
          if (u < 1) tallyRaf = requestAnimationFrame(step);
        })();
      }

      function go(i) {
        i = Math.max(-1, Math.min(ORDER.length - 1, i));
        if (i === idx) return;
        idx = i;
        render();
      }
      function fillChrome() {
        var t = UI[lang];
        $("mark").textContent = t.title;
        $("top").innerHTML = '<a href="' + home(lang) + 'events/">' + esc(t.all) + "</a>" +
          '<a class="wide" href="' + REPO + '/issues/new?template=new-event.yml" target="_blank" rel="noopener noreferrer">' + esc(t.submit) + " ↗</a>" +
          '<span class="sep"></span><a href="' + home("zh") + '" data-lang="zh" aria-current="' + (lang === "zh") + '">中文</a>' +
          '<a href="' + home("en") + '" data-lang="en" aria-current="' + (lang === "en") + '">EN</a>';
      }

      document.addEventListener("click", function (e) {
        var el = e.target.closest("[data-go],[data-i],[data-lang]");
        if (!el) return;
        var d = el.dataset;
        if (d.lang) {
          try { localStorage.setItem("aisec-lang", d.lang); } catch (err) {}
          if (idx >= 0) { e.preventDefault(); location.href = home(d.lang) + "#" + ORDER[idx].id; }
          return;
        }
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
        e.preventDefault();
        if (d.go) go(idx + Number(d.go));
        else go(Number(d.i));
      });
      $("mark").addEventListener("click", function () { go(-1); });
      window.addEventListener("hashchange", function () {
        go(ORDER.map(function (e) { return e.id; }).indexOf(decodeURIComponent(location.hash.slice(1))));
      });
      document.addEventListener("keydown", function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); go(idx + 1); }
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); go(idx - 1); }
      });

      /* 滚轮翻一件；鼠标在可滚动的文字里时，先滚文字 */
      var wheelAt = 0;
      window.addEventListener("wheel", function (e) {
        var box = e.target.closest && e.target.closest(".text,.strip");
        if (box && box.scrollHeight > box.clientHeight + 2) return;
        if (e.target.closest && e.target.closest(".strip")) return;
        var now = Date.now();
        if (now - wheelAt < 620 || Math.abs(e.deltaY) < 8) return;
        wheelAt = now;
        go(idx + (e.deltaY > 0 ? 1 : -1));
      }, { passive: true });

      var sx = null, sy = null;
      $("stage").addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
      $("stage").addEventListener("touchend", function (e) {
        if (sx === null) return;
        var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
        sx = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1));
      });

      if (!BOOT) $("stage").innerHTML = '<p class="error">Run <code>python3 scripts/build.py</code>, then open the page in <code>_site/</code>.</p>';
      else {
        ORDER = BOOT.data.events.slice().sort(function (a, b) {
          var x = sortDate(a), y = sortDate(b);
          return x === y ? (a.disclosed < b.disclosed ? -1 : 1) : x < y ? -1 : 1;
        });
        idx = ORDER.map(function (e) { return e.id; }).indexOf(decodeURIComponent(location.hash.slice(1)));
        fillChrome();
        buildScene();
        buildStrip();
        render();
      }
    </script>
  </body>
</html>
