<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d0f" />
    <link rel="icon" href="data:," />
    <title>AI Security Incident Timeline</title>
    <meta name="description" content="A sourced timeline of AI-enabled fraud and security incidents, with amounts, recovery figures and the strength of the evidence for AI use kept separate." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#0b0d0f; --bg-2:#111417; --surface:#16191d; --surface-2:#1e2227; --surface-3:#282d33;
        --ink:#f1f2ee; --ink-2:#b8bdc0; --ink-3:#858b91;
        --line:#2a2f35; --line-2:#3a4047;
        --red:#ff6b5c; --red-soft:#3a1d1a; --red-deep:#5c1a14;
        --teal:#4cc9a8; --teal-soft:#12322a; --teal-deep:#0d4a3b;
        --amber:#eeb34a; --amber-soft:#35290f; --amber-deep:#54400f;
        --serif:"Noto Serif SC",Georgia,serif;
        --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        --mono:"IBM Plex Mono",ui-monospace,monospace;
        color-scheme:dark;
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7}
      ::selection{background:var(--red);color:#17100f}
      a{color:inherit}
      button,select,input{font:inherit;color:inherit}
      button{cursor:pointer}
      :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
      [hidden]{display:none!important}

      /* ========== 外框 ========== */
      .app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
      .app.list-mode{height:auto;min-height:100vh;grid-template-rows:auto 1fr}
      .topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--bg)}
      .brand{appearance:none;border:0;background:none;padding:0;font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--ink);display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
      .brand::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
      .top-gap{flex:1}
      .toggle{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
      .toggle button{appearance:none;border:0;background:transparent;color:var(--ink-2);padding:5px 13px;font-size:13px;font-weight:700;white-space:nowrap}
      .toggle button+button{border-left:1px solid var(--line-2)}
      .toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

      /* ========== 故事舞台 ========== */
      .stage{position:relative;min-height:0;display:flex}
      .slide{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);gap:clamp(24px,4vw,56px);align-items:center;padding:clamp(18px,3.4vh,40px) clamp(72px,8vw,112px);overflow-y:auto;animation:enter .32s ease both}
      @keyframes enter{from{opacity:0;transform:translateX(var(--dir,18px))}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.slide{animation:none}}

      .poster{--tone:var(--red);--deep:var(--red-deep);position:sticky;top:0;align-self:center;overflow:hidden;border-radius:16px;min-height:min(62vh,500px);padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;justify-content:flex-end;background:radial-gradient(120% 100% at 85% 0%,var(--deep) 0%,#101316 62%);border:1px solid color-mix(in srgb,var(--tone) 28%,transparent)}
      .poster.blocked{--tone:var(--teal);--deep:var(--teal-deep)}
      .poster.info{--tone:var(--amber);--deep:var(--amber-deep)}
      .motif{position:absolute;top:58px;left:0;width:100%;height:auto;color:var(--tone);opacity:.55}
      .poster>*:not(.motif){position:relative}
      .p-label{position:absolute!important;top:clamp(20px,2.6vw,30px);left:clamp(22px,3vw,36px);font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--tone);text-transform:uppercase}
      .p-amount{font-family:var(--mono);font-weight:700;font-size:clamp(46px,7.2vw,92px);line-height:1;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 28px rgba(0,0,0,.55)}
      .p-amount.long{font-family:var(--serif);font-size:clamp(26px,3.3vw,40px);letter-spacing:0;line-height:1.25}
      .p-note{margin-top:12px;font-size:14.5px;line-height:1.6;color:#dfe2e0;max-width:32em}
      .p-scale{margin-top:16px}
      .p-scale .t{height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
      .p-scale .f{height:100%;background:var(--tone);border-radius:3px}
      .p-scale .c{margin-top:6px;font-size:11.5px;color:#a9afb2}

      .copy{min-width:0;align-self:center}
      .c-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;font-weight:700;color:var(--ink-2)}
      .tag{font-size:11.5px;font-weight:700;line-height:1.5;padding:2px 9px;border-radius:6px;white-space:nowrap}
      .tag.confirmed{background:var(--teal-soft);color:var(--teal)}
      .tag.assessed{background:var(--amber-soft);color:var(--amber)}
      .tag.self_reported,.tag.cat{background:var(--surface-3);color:var(--ink-2)}
      .copy h1,.copy h2{font-family:var(--serif);font-weight:900;font-size:clamp(23px,2.4vw,32px);line-height:1.32;margin:12px 0 0;text-wrap:balance}
      .copy h1{font-size:clamp(28px,3.2vw,42px);word-break:keep-all}
      .c-summary{margin:14px 0 0;color:var(--ink-2);font-size:15.5px;line-height:1.85}
      .c-take{margin-top:14px;padding:12px 16px;border-left:3px solid var(--amber);background:var(--surface);border-radius:0 10px 10px 0;font-size:14px;line-height:1.75;color:var(--ink-2)}
      .c-take b{display:block;color:var(--ink)}
      .c-src{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
      .c-src a{color:var(--ink-2);text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:2px 11px}
      .c-src a:hover{color:var(--ink);border-color:var(--ink-3)}

      /* 封面 */
      .cover .p-amount{font-size:clamp(40px,6vw,78px)}
      .cover .p-arrow{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--tone);margin:6px 0;letter-spacing:.06em}
      .cover-lede{margin:16px 0 0;font-size:clamp(16px,1.5vw,18.5px);line-height:1.8;color:var(--ink-2)}
      .cover-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:22px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
      .cover-stats div{background:var(--bg-2);padding:12px 14px}
      .cover-stats b{display:block;font-family:var(--mono);font-size:clamp(20px,2.2vw,26px);line-height:1.2;white-space:nowrap}
      .cover-stats span{display:block;margin-top:4px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
      .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
      .btn{appearance:none;border:1px solid var(--line-2);background:transparent;color:var(--ink);border-radius:10px;padding:10px 18px;font-size:14.5px;font-weight:700}
      .btn.primary{background:var(--red);border-color:var(--red);color:#1a0f0d}
      .btn:hover{filter:brightness(1.1)}

      /* 左右箭头 */
      .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;appearance:none;border:0;background:none;color:var(--ink-2);padding:8px 4px}
      .arrow svg{width:30px;height:30px}
      .arrow:hover{color:var(--ink)}
      .arrow span{font-size:11px;line-height:1.3;font-weight:700;color:var(--ink-3);text-align:center;max-width:62px}
      .arrow.prev{left:6px}.arrow.next{right:6px}

      /* ========== 底部时间导航 ========== */
      .tnav{border-top:1px solid var(--line);background:var(--bg-2);display:grid;grid-template-columns:auto minmax(0,1fr);min-height:0}
      .lanes{display:grid;grid-template-rows:repeat(3,32px) 24px;border-right:1px solid var(--line);padding:6px 0 0}
      .lanes div{display:flex;align-items:center;gap:7px;padding:0 14px;font-size:11.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
      .lanes i{width:8px;height:8px;border-radius:50%}
      .scroller{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
      .track{position:relative;height:126px;margin:0 auto}
      .lane-bg{position:absolute;left:0;right:0;height:32px}
      .lane-bg.l1{top:38px;background:rgba(255,255,255,.018)}
      .chip{position:absolute;width:144px;height:26px;appearance:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:11.5px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;transition:background .15s,color .15s,border-color .15s}
      .chip i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--tone)}
      .chip span{overflow:hidden;text-overflow:ellipsis}
      .chip:hover{color:var(--ink);border-color:var(--ink-3)}
      .chip[aria-current="true"]{background:var(--tone);border-color:var(--tone);color:#111}
      .chip[aria-current="true"] i{background:#111}
      .chip.loss{--tone:var(--red)}.chip.blocked{--tone:var(--teal)}.chip.info{--tone:var(--amber)}
      .tick{position:absolute;bottom:0;height:24px;border-left:1px solid var(--line-2);padding-left:6px;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-3);display:flex;align-items:center}

      /* ========== 列表视图 ========== */
      .list{max-width:1000px;width:100%;margin:0 auto;padding:22px 20px 64px}
      .controls{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
      .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
      .ctl+.ctl{margin-top:11px}
      .search{flex:1 1 220px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px;min-width:0}
      .search::placeholder{color:var(--ink-3)}
      .sort{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
      .pill{appearance:none;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
      .pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
      .count{font-family:var(--mono);font-size:13px;font-weight:700}
      .count-note{font-size:12.5px;color:var(--ink-3)}
      .row{appearance:none;display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:16px;width:100%;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 4px}
      .row:hover{background:var(--bg-2)}
      .row .d{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
      .row .t{font-weight:700;font-size:15.5px;line-height:1.5}
      .row .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
      .row .a{font-family:var(--mono);font-weight:700;font-size:17px;white-space:nowrap;text-align:right}
      .row .a.loss{color:var(--red)}.row .a.blocked{color:var(--teal)}.row .a.info{color:var(--amber);font-family:var(--sans);font-size:13px}
      .rows{margin-top:10px}
      .empty{padding:48px 20px;text-align:center;color:var(--ink-3)}
      .method{margin-top:32px;padding:22px 24px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
      .method h2{margin:0;font-size:17px;font-weight:900}
      .method p{margin:4px 0 16px;font-size:13.5px;color:var(--ink-3)}
      .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}
      .m-grid div{font-size:13.5px;line-height:1.75;color:var(--ink-2)}
      .m-grid b{display:block;color:var(--ink)}
      .links{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
      .links a{font-size:13px;font-weight:700;color:var(--ink-2);text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:5px 13px}
      .links a:hover{color:var(--ink);border-color:var(--ink-3)}
      .error{padding:60px 24px;text-align:center;color:var(--ink-2)}

      @media (max-width:980px){
        .slide{display:block;padding:16px 16px 72px}
        .poster{position:relative;min-height:0;padding:44px 20px 18px}
        .motif{top:0;opacity:.35}
        .p-amount{font-size:clamp(40px,13vw,64px)}
        .p-amount.long{font-size:24px}
        .copy{margin-top:18px}
        .copy h1,.copy h2{margin-top:12px}
        .arrow{top:auto;bottom:calc(var(--nav,70px) * 0 + 10px);transform:none;width:44px;height:44px;justify-content:center;background:var(--surface-2);border:1px solid var(--line-2);border-radius:50%;padding:0}
        .arrow span{display:none}
        .arrow svg{width:20px;height:20px}
        .arrow.prev{left:16px}.arrow.next{right:16px;left:auto}
        .stage{overflow:hidden}
        .lanes{display:none}
        .tnav{grid-template-columns:minmax(0,1fr)}
        .track{height:60px}
        .lane-bg{display:none}
        .chip{top:6px!important}
        .tick{height:20px}
        .topbar{padding:10px 14px;gap:8px}
        .brand{font-size:11px;letter-spacing:.08em}
        .toggle button{padding:4px 9px;font-size:12px}
        .m-grid{grid-template-columns:1fr}
      }
      @media (max-width:560px){
        .brand span{display:none}
        .row{grid-template-columns:minmax(0,1fr) auto;gap:10px}
        .row .d{grid-column:1/-1}
        .cover-stats{grid-template-columns:1fr}
        .cover-stats div{display:flex;align-items:baseline;gap:10px}
        .cover-stats span{margin:0}
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <button type="button" class="brand" id="brand"><span>AI SECURITY TIMELINE</span></button>
        <div class="top-gap"></div>
        <div class="toggle" id="viewToggle" role="group"></div>
        <div class="toggle" id="langToggle" role="group">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </header>

      <main class="stage" id="stage"></main>
      <main class="list" id="list" hidden></main>
      <nav class="tnav" id="tnav" aria-label="Timeline">
        <div class="lanes" id="lanes"></div>
        <div class="scroller" id="scroller"><div class="track" id="track"></div></div>
      </nav>
    </div>

    <script>
      var UI = {
        en: {
          htmlLang: "en", title: "AI Security Incident Timeline", nav: "Timeline",
          story: "Story", all: "All events",
          coverTitle: "The same trick, on a far bigger scale",
          coverLede: "A trusted voice, an urgent request, and a transfer before anyone checks. Each entry here keeps apart what was lost, what was recovered, and how strong the evidence is that AI was used at all.",
          coverBig: "largest single case",
          statLoss: function (n) { return "reported loss, " + n + " single cases"; },
          statConfirmed: function (n) { return "of that in " + n + " cases with AI use confirmed"; },
          statBlocked: "attempts stopped at $0",
          start: "Start from the first case", browse: "Browse all events",
          evLabel: { confirmed: "AI confirmed", assessed: "AI assessed", self_reported: "AI self-reported" },
          evAll: "All", evConfirmed: "AI confirmed", evAssessed: "AI assessed",
          cats: { all: "All types", voice: "Voice", video: "Video", breach: "Data breach", market: "Market", aggregate: "Annual total", blocked: "Stopped" },
          outcome: { loss: "Reported loss", blocked: "Stopped at $0", no_funds: "No funds reported lost", aggregate: "Annual total" },
          lanes: ["Loss", "Stopped", "Other"],
          occurred: "Occurred ", disclosed: "Disclosed ",
          scale: function (top, amt) { return "Log scale, full bar = " + top + " · about " + amt; },
          sources: "Sources", prev: "Previous", next: "Next", cover: "Intro",
          search: "Search: Hong Kong, voice clone, WhatsApp",
          sorts: { "time-desc": "Newest first", "time-asc": "Oldest first", "amount-desc": "Largest amount" },
          count: function (n) { return n + (n === 1 ? " event" : " events"); },
          noteSum: function (s) { return "Reported loss in this view: " + s; },
          noteAmount: "Largest first; events with no amount come last",
          empty: "No events match these filters.",
          methodHead: "How the numbers work",
          methodSub: "Totals are calculated from data/events.json. For a single case, the cited source wins. Data as of ",
          method: [
            ["How AI use is graded", "Confirmed: an authority, a court filing or the affected company says AI was used. Assessed: police, insurers, security firms or informed sources believe so. Self-reported: filers mentioned AI."],
            ["Loss and recovery stay separate", "Amounts are what was transferred or reported lost. Recovered or frozen funds appear in the notes and are not netted off."],
            ["Annual totals stay separate", "The FBI IC3 figure is a different level of measurement, so it is never added to single cases."],
            ["Exchange rates are approximate", ""]
          ],
          fix: "Report a correction",
          loadError: "Could not load data/events.json. Open this page through a web server, not as a local file."
        },
        zh: {
          htmlLang: "zh-CN", title: "AI 安全事件时间轴", nav: "时间轴",
          story: "故事", all: "全部事件",
          coverTitle: "同一个套路，规模已经完全不同",
          coverLede: "一个可信的声音，一句很急的话，核实之前钱已转走。这里的每条事件都把三件事分开写：损失多少、追回多少、用了 AI 的证据有多强。",
          coverBig: "最大单案",
          statLoss: function (n) { return n + " 起单案的报告损失"; },
          statConfirmed: function (n) { return "其中 " + n + " 起 AI 使用已确认"; },
          statBlocked: "起未遂，转出 $0",
          start: "从第一起看起", browse: "查看全部事件",
          evLabel: { confirmed: "AI 已确认", assessed: "AI 研判", self_reported: "AI 自报" },
          evAll: "全部", evConfirmed: "AI 已确认", evAssessed: "AI 研判",
          cats: { all: "全部类型", voice: "语音", video: "视频", breach: "数据泄露", market: "市场误导", aggregate: "年度总数", blocked: "已拦截" },
          outcome: { loss: "报告损失", blocked: "已拦截 · 转出 $0", no_funds: "未报告资金损失", aggregate: "年度总数" },
          lanes: ["损失", "拦截", "其他"],
          occurred: "发生 ", disclosed: "披露 ",
          scale: function (top, amt) { return "对数刻度，满格 = " + top + " · 约 " + amt; },
          sources: "来源", prev: "上一条", next: "下一条", cover: "开篇",
          search: "搜索：香港、声音克隆、WhatsApp",
          sorts: { "time-desc": "时间 · 新 → 旧", "time-asc": "时间 · 旧 → 新", "amount-desc": "金额 · 高 → 低" },
          count: function (n) { return "共 " + n + " 条"; },
          noteSum: function (s) { return "当前视图报告损失：" + s; },
          noteAmount: "按金额从高到低，无金额的排在最后",
          empty: "没有符合筛选的事件。",
          methodHead: "数字怎么算",
          methodSub: "合计由 data/events.json 自动计算；单案金额以所引来源为准。数据截至 ",
          method: [
            ["AI 证据怎么分级", "已确认：官方、法庭文件或受害公司明确说用了 AI。研判：警方、保险商、安全公司或知情人士认为用了。自报：投诉人提到了 AI。"],
            ["损失和追回分开", "金额指转出或报告的损失。追回、冻结写在说明里，不扣减成净额。"],
            ["年度总数分开", "FBI IC3 的数字是另一层级的统计，不与单案相加。"],
            ["汇率是约数", ""]
          ],
          fix: "提交更正",
          loadError: "无法加载 data/events.json。请通过网页服务器打开，不要直接打开本地文件。"
        }
      };

      var CATS = ["all", "voice", "video", "breach", "market", "aggregate", "blocked"];
      var CHEVRON = {
        prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>',
        next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>'
      };

      var DATA = null, ORDER = [];
      var state = { lang: pickLang(), view: "story", index: -1, dir: 1, ev: "all", cat: "all", sort: "time-desc", q: "" };

      function pickLang() {
        var q = new URLSearchParams(location.search).get("lang");
        if (q === "en" || q === "zh") return q;
        try {
          var saved = localStorage.getItem("aisec-lang");
          if (saved === "en" || saved === "zh") return saved;
        } catch (e) {}
        return /^zh/i.test(navigator.language || "") ? "zh" : "en";
      }

      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function t() { return UI[state.lang]; }
      function loc(ev) { return ev[state.lang]; }
      function isCase(ev) { return ev.outcome === "loss"; }
      function sortDate(ev) { return ev.occurred || ev.disclosed; }
      function tone(ev) { return ev.outcome === "loss" ? "loss" : ev.outcome === "blocked" ? "blocked" : "info"; }
      function sumLoss(list) { return list.filter(isCase).reduce(function (s, ev) { return s + ev.usd_m; }, 0); }

      function usd(m) {
        if (state.lang === "zh") {
          if (m >= 100) return "$" + (m / 100).toFixed(2) + " 亿";
          return "$" + (Math.round(m * (m >= 10 ? 10 : 100)) * (m >= 10 ? 10 : 1)).toLocaleString("en-US") + " 万";
        }
        if (m >= 1) return "$" + m.toLocaleString("en-US", { maximumFractionDigits: m >= 100 ? 0 : m >= 10 ? 1 : 2 }) + "M";
        return "$" + Math.round(m * 1000) + "K";
      }

      function dateText(d) {
        var p = d.split("-");
        if (state.lang === "zh") return p[0] + " 年" + (p[1] ? " " + Number(p[1]) + " 月" : "") + (p[2] ? " " + Number(p[2]) + " 日" : "");
        var m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return (p[2] ? Number(p[2]) + " " : "") + (p[1] ? m[Number(p[1]) - 1] + " " : "") + p[0];
      }
      function dateLine(ev) {
        var out = [];
        if (ev.occurred) out.push(t().occurred + dateText(ev.occurred));
        if (ev.disclosed && ev.disclosed !== ev.occurred) out.push(t().disclosed + dateText(ev.disclosed));
        return out.join(" · ");
      }

      function topEvent() {
        return DATA.events.reduce(function (a, b) { return (b.usd_m || 0) > (a.usd_m || 0) ? b : a; });
      }
      function scalePct(v, top) {
        return Math.max(4, Math.min(100, Math.log10(v + 1) / Math.log10(top + 1) * 100));
      }

      /* 海报背景：事件没有配图，按类型画一个抽象图形 */
      function seeded(id) {
        var h = 7;
        for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
        return function () { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; };
      }
      function motif(ev) {
        var r = seeded(ev ? ev.id : "cover"), kind = ev ? ev.category : "voice", s = "", i, x, y, h;
        if (kind === "video") {
          for (y = 0; y < 3; y++) for (x = 0; x < 4; x++) {
            var cx = 180 + x * 56, cy = 34 + y * 56, real = x === 2 && y === 1;
            s += '<rect x="' + (cx - 25) + '" y="' + (cy - 25) + '" width="50" height="50" rx="7" fill="' + (real ? "currentColor" : "none") + '" fill-opacity=".28" stroke="currentColor" stroke-opacity="' + (real ? 1 : .55) + '"/>';
            s += '<circle cx="' + cx + '" cy="' + (cy - 5) + '" r="8" fill="none" stroke="currentColor" stroke-opacity=".7"/><path d="M' + (cx - 14) + " " + (cy + 18) + "c4-13 24-13 28 0" + '" fill="none" stroke="currentColor" stroke-opacity=".7"/>';
          }
        } else if (kind === "breach") {
          var nodes = [];
          for (i = 0; i < 16; i++) nodes.push([190 + r() * 200, 16 + r() * 150]);
          nodes.forEach(function (n, k) {
            var m = nodes[(k + 3) % nodes.length], o = nodes[(k + 7) % nodes.length];
            s += '<path d="M' + n[0] + " " + n[1] + "L" + m[0] + " " + m[1] + "M" + n[0] + " " + n[1] + "L" + o[0] + " " + o[1] + '" stroke="currentColor" stroke-opacity=".28"/>';
            s += '<circle cx="' + n[0] + '" cy="' + n[1] + '" r="' + (k % 4 === 0 ? 5 : 3) + '" fill="currentColor"/>';
          });
        } else if (kind === "market") {
          var p = "M0 70", v = 70;
          for (i = 1; i <= 40; i++) {
            v += (r() - .5) * 8;
            if (i === 24) v += 52;
            if (i === 27) v -= 46;
            p += "L" + i * 10 + " " + v.toFixed(1);
          }
          s = '<path d="' + p + '" fill="none" stroke="currentColor" stroke-width="2"/>';
        } else if (kind === "aggregate") {
          for (i = 0; i < 48; i++) {
            x = 12 * (i % 34) + 6; y = 14 + 14 * Math.floor(i / 8);
            s += '<circle cx="' + (x * .6 + 190) + '" cy="' + ((i % 8) * 22 + 12) + '" r="3" fill="currentColor" fill-opacity="' + (.25 + r() * .75).toFixed(2) + '"/>';
          }
        } else {
          for (i = 0; i < 62; i++) {
            var env = Math.sin(i / 61 * Math.PI);
            h = (10 + r() * 150) * (.2 + env * .8);
            s += '<rect x="' + (i * 6.6 + 2) + '" y="' + (90 - h / 2).toFixed(1) + '" width="3" height="' + h.toFixed(1) + '" rx="1.5" fill="currentColor"/>';
          }
        }
        return '<svg class="motif" viewBox="0 0 410 180" preserveAspectRatio="xMidYMin meet" aria-hidden="true">' + s + "</svg>";
      }

      function arrows() {
        var i = state.index, h = "";
        if (i >= 0) {
          var before = i === 0 ? t().cover : loc(ORDER[i - 1]).short;
          h += '<button type="button" class="arrow prev" data-go="-1" aria-label="' + esc(t().prev) + '">' + CHEVRON.prev + "<span>" + esc(before) + "</span></button>";
        }
        if (i < ORDER.length - 1) {
          h += '<button type="button" class="arrow next" data-go="1" aria-label="' + esc(t().next) + '">' + CHEVRON.next + "<span>" + esc(loc(ORDER[i + 1]).short) + "</span></button>";
        }
        return h;
      }

      function coverHtml() {
        var cases = DATA.events.filter(isCase);
        var confirmed = cases.filter(function (e) { return e.ai_evidence === "confirmed"; });
        var blocked = DATA.events.filter(function (e) { return e.outcome === "blocked"; });
        var first = cases.slice().sort(function (a, b) { return sortDate(a) < sortDate(b) ? -1 : 1; })[0];
        var big = cases.reduce(function (a, b) { return b.usd_m > a.usd_m ? b : a; });
        return '<section class="slide cover" style="--dir:' + state.dir * 18 + 'px">' +
          '<div class="poster">' + motif(null) +
            '<div class="p-label">' + esc(sortDate(first).slice(0, 4)) + " → " + esc(sortDate(big).slice(0, 4)) + "</div>" +
            '<div class="p-amount">' + esc(usd(first.usd_m).replace(" ", "")) + "</div>" +
            '<div class="p-arrow">↓ ≈ ' + Number((big.usd_m / first.usd_m).toPrecision(2)) + "× · " + esc(t().coverBig) + "</div>" +
            '<div class="p-amount">' + esc(usd(big.usd_m).replace(" ", "")) + "</div>" +
          "</div>" +
          '<div class="copy"><h1>' + esc(t().coverTitle) + "</h1>" +
            '<p class="cover-lede">' + esc(t().coverLede) + "</p>" +
            '<div class="cover-stats">' +
              "<div><b>≈ " + esc(usd(sumLoss(cases))) + "</b><span>" + esc(t().statLoss(cases.length)) + "</span></div>" +
              "<div><b>≈ " + esc(usd(sumLoss(confirmed))) + "</b><span>" + esc(t().statConfirmed(confirmed.length)) + "</span></div>" +
              "<div><b>" + blocked.length + "</b><span>" + esc(t().statBlocked) + "</span></div>" +
            "</div>" +
            '<div class="cta"><button type="button" class="btn primary" data-go="1">' + esc(t().start) + ' →</button><button type="button" class="btn" data-view="list">' + esc(t().browse) + "</button></div>" +
          "</div></section>";
      }

      function slideHtml(ev) {
        var l = loc(ev), top = topEvent(), scale = "";
        if (ev.usd_m > 0) {
          scale = '<div class="p-scale"><div class="t"><div class="f" style="width:' + scalePct(ev.usd_m, top.usd_m).toFixed(1) + '%"></div></div><div class="c">' + esc(t().scale(loc(top).amount, usd(ev.usd_m))) + "</div></div>";
        }
        var long = ev.usd_m === null;
        var srcs = ev.sources.map(function (s) {
          return '<a href="' + esc(encodeURI(s.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(s.name) + " ↗</a>";
        }).join("");
        return '<section class="slide" style="--dir:' + state.dir * 18 + 'px">' +
          '<div class="poster ' + tone(ev) + '">' + motif(ev) +
            '<div class="p-label">' + esc(t().outcome[ev.outcome]) + "</div>" +
            '<div class="p-amount' + (long ? " long" : "") + '">' + esc(l.amount) + "</div>" +
            '<div class="p-note">' + esc(l.amount_note) + "</div>" + scale +
          "</div>" +
          '<div class="copy">' +
            '<div class="c-meta"><span>' + esc(dateLine(ev)) + '</span><span class="tag ' + esc(ev.ai_evidence) + '">' + esc(t().evLabel[ev.ai_evidence]) + "</span>" +
              (ev.category === "aggregate" ? "" : '<span class="tag cat">' + esc(t().cats[ev.category]) + "</span>") + "</div>" +
            "<h2>" + esc(l.title) + "</h2>" +
            '<p class="c-summary">' + esc(l.summary) + "</p>" +
            '<div class="c-take"><b>' + esc(l.takeaway_label) + "</b>" + esc(l.takeaway) + "</div>" +
            '<div class="c-src"><span>' + esc(t().sources) + "</span>" + srcs + "</div>" +
          "</div></section>";
      }

      function renderStage() {
        var i = state.index;
        $("stage").innerHTML = (i < 0 ? coverHtml() : slideHtml(ORDER[i])) + arrows();
        var chips = $("track").querySelectorAll(".chip");
        for (var k = 0; k < chips.length; k++) {
          var on = k === i;
          chips[k].setAttribute("aria-current", on ? "true" : "false");
          if (on) centerChip(chips[k]);
        }
        if (i < 0) $("scroller").scrollTo({ left: 0, behavior: reduced() ? "auto" : "smooth" });
      }
      function reduced() { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
      function centerChip(c) {
        var sc = $("scroller");
        sc.scrollTo({ left: c.offsetLeft + c.offsetWidth / 2 - sc.clientWidth / 2, behavior: reduced() ? "auto" : "smooth" });
      }

      function renderNav() {
        var STEP = 156, PAD = 12, lastYear = null, html = '<div class="lane-bg l1"></div>';
        var laneTop = { loss: 8, blocked: 40, info: 72 };
        ORDER.forEach(function (ev, i) {
          var x = PAD + i * STEP, y = sortDate(ev).slice(0, 4);
          html += '<button type="button" class="chip ' + tone(ev) + '" data-i="' + i + '" style="left:' + x + "px;top:" + laneTop[tone(ev)] + 'px" title="' + esc(loc(ev).title) + '"><i></i><span>' + esc(loc(ev).short) + "</span></button>";
          if (y !== lastYear) { html += '<div class="tick" style="left:' + x + 'px">' + y + "</div>"; lastYear = y; }
        });
        $("track").innerHTML = html;
        $("track").style.width = PAD * 2 + ORDER.length * STEP - 12 + "px";
        $("lanes").innerHTML = t().lanes.map(function (n, i) {
          return '<div><i style="background:var(--' + ["red", "teal", "amber"][i] + ')"></i>' + esc(n) + "</div>";
        }).join("") + "<div></div>";
        $("tnav").setAttribute("aria-label", t().nav);
      }

      function renderChrome() {
        document.documentElement.lang = t().htmlLang;
        document.title = t().title;
        $("viewToggle").innerHTML = [["story", t().story], ["list", t().all]].map(function (v) {
          return '<button type="button" data-view="' + v[0] + '" aria-pressed="' + (state.view === v[0]) + '">' + esc(v[1]) + "</button>";
        }).join("");
        var b = $("langToggle").querySelectorAll("button");
        for (var i = 0; i < b.length; i++) b[i].setAttribute("aria-pressed", b[i].getAttribute("data-lang") === state.lang ? "true" : "false");
        var list = state.view === "list";
        $("app").classList.toggle("list-mode", list);
        $("stage").hidden = list;
        $("tnav").hidden = list;
        $("list").hidden = !list;
      }

      function listRows() {
        var q = state.q, rows = DATA.events.filter(function (ev) {
          if (state.ev !== "all" && ev.ai_evidence !== state.ev) return false;
          if (state.cat === "blocked" && ev.outcome !== "blocked") return false;
          if (state.cat !== "all" && state.cat !== "blocked" && ev.category !== state.cat) return false;
          if (q) {
            var l = loc(ev);
            if ([l.title, l.amount, l.amount_note, l.summary, l.takeaway, t().cats[ev.category], dateLine(ev)].join(" ").toLowerCase().indexOf(q) === -1) return false;
          }
          return true;
        });
        rows.sort(function (a, b) {
          if (state.sort === "amount-desc") {
            var av = a.usd_m === null ? -1 : a.usd_m, bv = b.usd_m === null ? -1 : b.usd_m;
            if (bv !== av) return bv - av;
          }
          var c = sortDate(a) < sortDate(b) ? 1 : -1;
          return state.sort === "time-asc" ? -c : c;
        });
        $("count").textContent = t().count(rows.length);
        $("countNote").textContent = state.sort === "amount-desc" ? t().noteAmount : t().noteSum(usd(sumLoss(rows)));
        $("rows").innerHTML = rows.length ? rows.map(function (ev) {
          var l = loc(ev);
          return '<button type="button" class="row" data-id="' + esc(ev.id) + '">' +
            '<span class="d">' + esc(sortDate(ev)) + "</span>" +
            '<span><span class="t">' + esc(l.title) + '</span><span class="m"><span class="tag ' + esc(ev.ai_evidence) + '">' + esc(t().evLabel[ev.ai_evidence]) + '</span><span class="tag cat">' + esc(t().outcome[ev.outcome]) + "</span></span></span>" +
            '<span class="a ' + tone(ev) + '">' + esc(l.amount) + "</span></button>";
        }).join("") : '<div class="empty">' + esc(t().empty) + "</div>";
      }

      function renderList() {
        var u = t();
        var segs = [["all", u.evAll], ["confirmed", u.evConfirmed], ["assessed", u.evAssessed]].map(function (s) {
          return '<button type="button" class="pill" data-ev="' + s[0] + '" aria-pressed="' + (state.ev === s[0]) + '">' + esc(s[1]) + "</button>";
        }).join("");
        var cats = CATS.map(function (c) {
          return '<button type="button" class="pill" data-cat="' + c + '" aria-pressed="' + (state.cat === c) + '">' + esc(u.cats[c]) + "</button>";
        }).join("");
        var sorts = Object.keys(u.sorts).map(function (k) {
          return '<option value="' + k + '"' + (state.sort === k ? " selected" : "") + ">" + esc(u.sorts[k]) + "</option>";
        }).join("");
        var method = u.method.map(function (m, i) {
          return "<div><b>" + esc(m[0]) + "</b>" + esc(i === u.method.length - 1 ? DATA.fx_note[state.lang] : m[1]) + "</div>";
        }).join("");
        $("list").innerHTML =
          '<div class="controls"><div class="ctl">' + segs + '<input id="q" class="search" type="search" placeholder="' + esc(u.search) + '" aria-label="' + esc(u.search) + '" value="' + esc(state.q) + '" /><select id="sortSel" class="sort" aria-label="Sort">' + sorts + "</select></div>" +
          '<div class="ctl">' + cats + '</div><div class="ctl"><span class="count" id="count"></span><span class="count-note" id="countNote"></span></div></div>' +
          '<div class="rows" id="rows"></div>' +
          '<section class="method"><h2>' + esc(u.methodHead) + "</h2><p>" + esc(u.methodSub + DATA.updated) + '</p><div class="m-grid">' + method + "</div>" +
          '<div class="links"><a href="https://github.com/chokebit/AISec-Timeline" rel="noopener noreferrer">GitHub</a><a href="data/events.json">events.json</a><a href="https://github.com/chokebit/AISec-Timeline/issues/new" rel="noopener noreferrer">' + esc(u.fix) + "</a></div></section>";
        listRows();
      }

      function renderAll() {
        renderChrome();
        if (state.view === "list") { renderList(); return; }
        renderNav();
        renderStage();
      }

      function syncHash() {
        var id = state.view === "list" ? "list" : state.index >= 0 ? ORDER[state.index].id : "";
        history.replaceState(null, "", location.pathname + location.search + (id ? "#" + id : ""));
      }
      function go(i) {
        i = Math.max(-1, Math.min(ORDER.length - 1, i));
        if (i === state.index) return;
        state.dir = i > state.index ? 1 : -1;
        state.index = i;
        renderStage();
        syncHash();
      }
      function setView(v) {
        state.view = v;
        renderAll();
        syncHash();
        window.scrollTo(0, 0);
      }
      function readHash() {
        var h = decodeURIComponent(location.hash.slice(1));
        if (h === "list") { state.view = "list"; return; }
        state.view = "story";
        state.index = ORDER.map(function (e) { return e.id; }).indexOf(h);
      }

      document.addEventListener("click", function (e) {
        var el = e.target.closest("[data-go],[data-view],[data-lang],[data-i],[data-ev],[data-cat],[data-id]");
        if (!el) return;
        var d = el.dataset;
        if (d.go) go(state.index + Number(d.go));
        else if (d.view) setView(d.view);
        else if (d.i) go(Number(d.i));
        else if (d.id) {
          state.index = ORDER.map(function (o) { return o.id; }).indexOf(d.id);
          setView("story");
        } else if (d.lang) {
          state.lang = d.lang;
          try { localStorage.setItem("aisec-lang", d.lang); } catch (err) {}
          renderAll();
        } else if (d.ev) { state.ev = d.ev; renderList(); }
        else if (d.cat) { state.cat = d.cat; renderList(); }
      });
      $("brand").addEventListener("click", function () { state.index = -1; setView("story"); });
      document.addEventListener("input", function (e) {
        if (e.target.id === "q") { state.q = e.target.value.trim().toLowerCase(); listRows(); }
      });
      document.addEventListener("change", function (e) {
        if (e.target.id === "sortSel") { state.sort = e.target.value; listRows(); }
      });
      document.addEventListener("keydown", function (e) {
        if (state.view !== "story" || e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key === "ArrowRight") go(state.index + 1);
        if (e.key === "ArrowLeft") go(state.index - 1);
      });
      window.addEventListener("hashchange", function () { readHash(); renderAll(); });

      var touchX = null, touchY = null;
      $("stage").addEventListener("touchstart", function (e) {
        touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
      }, { passive: true });
      $("stage").addEventListener("touchend", function (e) {
        if (touchX === null) return;
        var dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
        touchX = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(state.index + (dx < 0 ? 1 : -1));
      });

      fetch("data/events.json")
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          DATA = d;
          ORDER = d.events.slice().sort(function (a, b) {
            var x = sortDate(a), y = sortDate(b);
            return x === y ? (a.disclosed < b.disclosed ? -1 : 1) : x < y ? -1 : 1;
          });
          readHash();
          renderAll();
        })
        .catch(function () {
          $("stage").innerHTML = '<p class="error">' + esc(t().loadError) + "</p>";
        });
    </script>
  </body>
</html>
