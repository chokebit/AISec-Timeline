<!doctype html>
<html lang="zh-CN" data-skin="a">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>AI 乱纪元</title>
    <meta name="description" content="Major security events of the AI era: the biggest losses, the turning points and the moments nobody expected, with the human role in each one spelled out." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root{--bg:#f7f6f1;--ink:#17171a;--dim:#6d6d70;--line:#17171a;--panel:rgba(247,246,241,.86);--red:#c8281c;
        --serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
      /* A 暗房：黑色美术馆，暖光打在发光的作品上 */
      html[data-skin="a"]{--bg:#08080b;--ink:#f3efe6;--dim:#9c978c;--red:#ff6a45;--panel:rgba(18,17,20,.72);--wall:#1b181e;--floor:#17141a;--ceil:#0f0d12;--rib:rgba(255,226,180,.1);--frame:#0d0c10;--edge:rgba(255,226,180,.32);--light:#ffdca8;--panelline:rgba(255,226,180,.16)}
      /* B 霓虹：紫色电子空间，最接近参考视频的气氛 */
      html[data-skin="b"]{--bg:#0c0418;--ink:#f6efff;--dim:#b19fce;--red:#ff4fb0;--panel:rgba(26,10,48,.66);--wall:#1a0833;--floor:#12052a;--ceil:#16062e;--rib:rgba(214,120,255,.34);--frame:#12052a;--edge:rgba(230,150,255,.6);--light:#f7c6ff;--panelline:rgba(230,170,255,.28)}
      /* C 宣纸：水墨和朱砂，东方编年史 */
      html[data-skin="c"]{--bg:#e9e2d2;--ink:#1c1a17;--dim:#6f6657;--red:#b3261e;--panel:rgba(245,240,228,.82);--wall:#e4dccb;--floor:#d6ccb6;--ceil:#efe9db;--rib:rgba(40,32,20,.16);--frame:#f3eee1;--edge:rgba(40,32,20,.5);--light:transparent;--panelline:rgba(40,32,20,.2)}
      *{box-sizing:border-box}
      html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
      a{color:inherit}
      button{font:inherit;color:inherit;cursor:pointer}
      :focus-visible{outline:2px solid var(--red);outline-offset:2px}
      [hidden]{display:none!important}

      .world{position:fixed;inset:0;z-index:0;overflow:hidden;perspective:1000px;perspective-origin:50% 48%;background:var(--bg)}
      .scene{position:absolute;left:50%;top:48%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
      .plane{position:absolute;background:var(--floor)}
      .plane.top{background:var(--ceil)}
      .plane.side{background:var(--wall)}
      html[data-skin="a"] .plane.side{background:linear-gradient(180deg,#141216,#28232b 58%,#141216)}
      html[data-skin="a"] .plane:not(.side):not(.top){background:linear-gradient(90deg,#141116,#2b2630 50%,#141116)}
      html[data-skin="b"] .plane{background-image:linear-gradient(rgba(214,120,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(214,120,255,.3) 1px,transparent 1px);background-size:150px 150px}
      .rib{position:absolute;border:1px solid var(--rib)}
      .lamp{position:absolute;width:300px;height:12px;margin-left:-150px;background:var(--light);border-radius:2px;box-shadow:0 0 34px 10px color-mix(in srgb,var(--light) 55%,transparent)}
      html[data-skin="c"] .lamp{display:none}
      .frame{position:absolute;left:-200px;top:-250px;width:400px;height:500px;background:var(--frame);border:1px solid var(--edge);padding:16px 16px 14px;box-shadow:0 0 90px 6px color-mix(in srgb,var(--light) 16%,transparent),0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px;backface-visibility:visible}
      .frame canvas{flex:1;min-height:0;width:100%;display:block}
      .frame b{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1.1;white-space:nowrap;overflow:hidden}
      .frame.loss b{color:var(--red)}
      .frame span{font-family:var(--mono);font-size:14px;color:var(--dim)}
      .fog{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,var(--bg) 0,var(--bg) 4%,transparent 26%),radial-gradient(ellipse at 50% 50%,transparent 52%,color-mix(in srgb,var(--bg) 78%,transparent) 100%)}
      .skins{position:fixed;z-index:20;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;font-size:13px}
      .skins a{padding:3px 11px;border-radius:999px;color:var(--dim);text-decoration:none;border:1px solid var(--panelline)}
      .skins a[aria-current="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}

      .bar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;pointer-events:none}
      .bar>*{pointer-events:auto}
      .mark{appearance:none;border:0;background:none;padding:0;font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.04em}
      .lang{display:flex;gap:12px;font-family:var(--mono);font-size:13px}
      .lang button{appearance:none;border:0;background:none;padding:0;color:var(--dim)}
      .lang button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}

      .intro{position:fixed;z-index:10;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
      .intro h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(46px,8vw,92px);line-height:1.15;letter-spacing:.06em}
      .intro .en{margin-top:6px;font-size:clamp(18px,2.2vw,26px)}
      .intro .typed{margin-top:16px;min-height:1.7em;font-size:clamp(15px,1.5vw,18px);color:var(--dim)}
      .intro .typed::after{content:"|";margin-left:2px;animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .intro .hint{margin-top:30px;font-family:var(--mono);font-size:12.5px;color:var(--dim);display:flex;flex-direction:column;gap:6px;align-items:center}
      .intro .hint i{font-style:normal;animation:bob 1.8s ease-in-out infinite}
      @keyframes bob{50%{transform:translateY(5px)}}

      .label{position:fixed;z-index:12;left:22px;bottom:18px;font-family:var(--mono);font-size:12.5px;color:var(--dim);pointer-events:none}
      .label b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--ink)}
      .nav{position:fixed;z-index:12;right:22px;bottom:20px;display:flex;gap:8px}
      .nav button{appearance:none;width:38px;height:34px;border:1px solid var(--panelline);border-radius:8px;background:var(--panel);color:var(--ink);font-family:var(--mono)}
      .nav button:disabled{opacity:.3;cursor:default}

      .panel{position:fixed;z-index:15;top:50%;left:calc(50% + 36px);width:min(470px,calc(50vw - 64px));max-height:min(80vh,620px);overflow-y:auto;padding:24px 26px;background:var(--panel);border:1px solid var(--panelline);border-radius:14px;-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 24px 70px rgba(0,0,0,.4);transform:translateY(-50%);opacity:0;pointer-events:none;overscroll-behavior:contain;transition:background-color .35s,color .35s}
      .panel.flip{left:auto;right:calc(50% + 36px)}
      .panel.on{pointer-events:auto}
      .p-meta{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
      .p-meta em{font-style:normal;color:var(--ink);border:1px solid currentColor;padding:0 6px}
      .p-meta em.none{color:var(--red)}
      .panel h2{margin:10px 0 0;font-family:var(--serif);font-weight:700;font-size:clamp(17px,1.6vw,20px);line-height:1.5;text-wrap:pretty}
      .p-amt{font-family:var(--serif);font-weight:900;font-size:clamp(36px,4.6vw,56px);line-height:1.1}
      .p-amt.loss{color:var(--red)}
      .p-note{margin-top:5px;font-size:13.5px;color:var(--dim);line-height:1.6}
      .p-human{margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--ink) 22%,transparent);font-size:15px;line-height:1.7}
      .p-human b{display:block;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--dim)}
      .panel details{margin-top:11px;font-size:14.5px;line-height:1.8}
      .panel summary{cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
      .panel details p{margin:7px 0 0}
      .panel details ol{margin:7px 0 0;padding-left:20px}
      .p-src{margin-top:11px;display:flex;flex-wrap:wrap;gap:3px 13px;font-size:12.5px;color:var(--dim)}
      .p-src a{text-underline-offset:3px}

      .track{position:relative;pointer-events:none}
      .error{position:fixed;z-index:30;inset:auto 0 40%;text-align:center}
      @media (max-width:640px){
        .world{perspective:760px;perspective-origin:50% 26%}
        .scene{top:26%}
        .panel,.panel.flip{top:auto;left:16px;right:16px;width:auto;bottom:62px;transform:none;max-height:56vh;padding:15px 16px}
        .label{bottom:16px;left:16px}.label b{font-size:22px}
        .nav{right:16px;bottom:16px}
        .bar{padding:12px 16px}
      }
      @media (prefers-reduced-motion:reduce){.intro .hint i,.intro .typed::after{animation:none}}
    </style>
  </head>
  <body>
    <div class="track" id="track"></div>
    <div class="world" id="world" aria-hidden="true">
      <div class="scene" id="scene"></div>
      <div class="fog"></div>
    </div>

    <div class="bar">
      <button type="button" class="mark" id="mark"></button>
      <nav class="skins" id="skins"></nav>
      <div class="lang" id="lang">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>

    <section class="intro" id="intro">
      <h1 id="iTitle"></h1>
      <div class="en" id="iEn"></div>
      <div class="typed" id="iTyped"></div>
      <div class="hint"><span id="iHint"></span><i>↓</i></div>
    </section>

    <div class="label" id="label"></div>
    <article class="panel" id="panel"></article>
    <div class="nav">
      <button type="button" id="prev" aria-label="Previous">←</button>
      <button type="button" id="next" aria-label="Next">→</button>
    </div>

    <script>
      var UI = {
        zh: { lang: "zh-CN", title: "AI 乱纪元", en: "AI Chaotic Era", typed: ["AI 时代安全大事件。", "记录金钱、失控和突破想象的时刻。", "每一条都写清楚：人，还在不在。"], hint: "向前走", mark: "AI 乱纪元",
          human: "人在哪里", more: "展开经过", trace: "攻击链路",
          ev: { confirmed: "AI 已确认", assessed: "AI 研判", self_reported: "AI 自报", unknown: "AI 参与未明" },
          occurred: "发生 ", disclosed: "披露 " },
        en: { lang: "en", title: "AI Chaotic Era", en: "Major security events of the AI era", typed: ["Major security events of the AI era.", "Money, loss of control, and what nobody expected.", "Each entry says it plainly: were humans still there?"], hint: "Walk forward", mark: "AI Chaotic Era",
          human: "Where the humans were", more: "Read the details", trace: "Attack trace",
          ev: { confirmed: "AI confirmed", assessed: "AI assessed", self_reported: "AI self-reported", unknown: "AI role unknown" },
          occurred: "Occurred ", disclosed: "Disclosed " }
      };
      var STEP = 1000, H = 720, W = 1120;
      var ORDER = [], lang = pickLang(), cur = -2, typeTimer = null;

      function pickLang() {
        var q = new URLSearchParams(location.search).get("lang");
        if (q === "en" || q === "zh") return q;
        try { var s = localStorage.getItem("aisec-lang"); if (s === "en" || s === "zh") return s; } catch (e) {}
        return /^zh/i.test(navigator.language || "") ? "zh" : "en";
      }
      function $(id) { return document.getElementById(id); }
      function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
      function sortDate(e) { return e.occurred || e.disclosed; }
      function mix(a, b, t) { return a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }); }
      function rgb(c) { return "rgb(" + c.join(",") + ")"; }
      function dateText(d) {
        var p = d.split("-");
        if (lang === "zh") return p[0] + " 年" + (p[1] ? " " + Number(p[1]) + " 月" : "") + (p[2] ? " " + Number(p[2]) + " 日" : "");
        var m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return (p[2] ? Number(p[2]) + " " : "") + (p[1] ? m[Number(p[1]) - 1] + " " : "") + p[0];
      }
      function dateLine(e) {
        var t = UI[lang], o = [];
        if (e.occurred) o.push(t.occurred + dateText(e.occurred));
        if (e.disclosed && e.disclosed !== e.occurred) o.push(t.disclosed + dateText(e.disclosed));
        return o.join(" · ");
      }

      var SKIN = new URLSearchParams(location.search).get("style");
      if (SKIN !== "b" && SKIN !== "c") SKIN = "a";
      document.documentElement.setAttribute("data-skin", SKIN);
      var PALETTE = {
        a: { loss: ["#ff5a2c", "#ffb04a", "#ffe2a8"], blocked: ["#39e6b4", "#a4ffe0", "#e8fff6"], other: ["#6f8cff", "#c5a8ff", "#eadcff"] },
        b: { loss: ["#ff2bb4", "#ff7a3c", "#ffe14a"], blocked: ["#00e5ff", "#7dffcf", "#e9ff5a"], other: ["#7a5cff", "#29b6ff", "#ff7ae0"] },
        c: { loss: ["#1c1a17", "#3a342b", "#b3261e"], blocked: ["#1c1a17", "#4c5a50", "#7b8a7d"], other: ["#1c1a17", "#3d4656", "#7c8596"] }
      };

      /* 展品由代码生成：流场线条，越靠后的事件越乱 */
      function paint(cv, ev, i) {
        var c = cv.getContext("2d"), w = cv.width, h = cv.height, seed = 7, k;
        for (k = 0; k < ev.id.length; k++) seed = (seed * 31 + ev.id.charCodeAt(k)) >>> 0;
        function r() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
        var chaos = i / Math.max(1, ORDER.length - 1), tone = ev.outcome === "loss" ? "loss" : ev.outcome === "blocked" ? "blocked" : "other";
        var pal = PALETTE[SKIN][tone];
        var g = c.createLinearGradient(0, 0, w, h);
        if (SKIN === "c") { g.addColorStop(0, "#f4efe2"); g.addColorStop(1, "#e7dfcc"); }
        else if (SKIN === "b") { g.addColorStop(0, "#1b0838"); g.addColorStop(1, "#07021a"); }
        else { g.addColorStop(0, "#15131a"); g.addColorStop(1, "#08070a"); }
        c.fillStyle = g; c.fillRect(0, 0, w, h);
        c.globalCompositeOperation = SKIN === "c" ? "multiply" : "screen";
        var blobs = SKIN === "c" ? 5 : 4;
        for (k = 0; k < blobs; k++) {
          var bx = r() * w, by = r() * h, br = 110 + r() * 190, wash = c.createRadialGradient(bx, by, 0, bx, by, br);
          var col = SKIN === "c" ? "#2a241c" : pal[k % pal.length];
          wash.addColorStop(0, col); wash.addColorStop(1, "rgba(0,0,0,0)");
          c.globalAlpha = SKIN === "c" ? 0.3 : 0.5;
          if (SKIN === "c") { wash = c.createRadialGradient(bx, by, 0, bx, by, br); wash.addColorStop(0, "rgba(42,36,28,.8)"); wash.addColorStop(1, "rgba(42,36,28,0)"); }
          c.fillStyle = wash; c.fillRect(0, 0, w, h);
        }
        /* 几组频率随种子变化，每件作品的走向都不同 */
        var f = [], fi;
        for (fi = 0; fi < 4; fi++) f.push({ x: (0.5 + r() * 3) / w, y: (0.5 + r() * 3) / h, p: r() * 6.28 });
        var bend = 1.1 + chaos * 2.6, cx = w * (0.2 + r() * 0.6), cy = h * (0.2 + r() * 0.6);
        c.globalCompositeOperation = SKIN === "c" ? "multiply" : "lighter";
        function run(n, len, width, alpha) {
          c.lineWidth = width;
          for (var q = 0; q < n; q++) {
            var a0 = r() * 6.28, rad = Math.pow(r(), 0.6) * w * 0.62, x = cx + Math.cos(a0) * rad, y = cy + Math.sin(a0) * rad;
            c.strokeStyle = pal[Math.floor(r() * pal.length)];
            c.globalAlpha = alpha * (0.5 + r());
            c.beginPath(); c.moveTo(x, y);
            for (var t = 0; t < len; t++) {
              var a = 0;
              for (fi = 0; fi < 4; fi++) a += Math.sin(x * f[fi].x * 6.28 + y * f[fi].y * 6.28 + f[fi].p);
              a *= bend;
              x += Math.cos(a) * 3; y += Math.sin(a) * 3;
              c.lineTo(x, y);
            }
            c.stroke();
          }
        }
        if (SKIN === "c") { run(170, 70, 1.6, 0.1); run(110, 90, 0.6, 0.3); }
        else { run(150, 70, 5, 0.035); run(320, 60, 1, 0.16); run(46, 110, 1.4, 0.6); }
        c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
        if (SKIN === "c" && ev.outcome === "loss") {
          c.fillStyle = "#b3261e"; c.fillRect(w - 58, 20, 38, 38);
        }
      }

      function build() {
        var small = window.innerWidth < 640, L = (ORDER.length + 4) * STEP, html = "";
        W = small ? 640 : 1280;
        var flat = "width:" + W + "px;height:" + L + "px;transform-origin:0 0;";
        var side = "width:" + L + "px;height:" + H + "px;transform-origin:0 0;";
        html += '<div class="plane" style="' + flat + "transform:translate3d(" + (-W / 2) + "px," + H / 2 + 'px,0) rotateX(-90deg)"></div>';
        html += '<div class="plane top" style="' + flat + "transform:translate3d(" + (-W / 2) + "px," + (-H / 2) + 'px,0) rotateX(-90deg)"></div>';
        for (var q = 0; q < ORDER.length + 4; q++) {
          html += '<div class="lamp" style="left:0;top:' + (-H / 2 + 4) + "px;transform:translateZ(" + (-q * STEP - 500) + 'px) rotateX(90deg)"></div>';
        }
        html += '<div class="plane side" style="' + side + "transform:translate3d(" + (-W / 2) + "px," + (-H / 2) + 'px,0) rotateY(90deg)"></div>';
        html += '<div class="plane side" style="' + side + "transform:translate3d(" + W / 2 + "px," + (-H / 2) + 'px,0) rotateY(90deg)"></div>';
        /* 门框给出纵深，越往后越歪 */
        for (var k = 0; k < (ORDER.length + 4) * 2; k++) {
          var rot = (k % 2 ? 1 : -1) * Math.pow(k / ((ORDER.length + 4) * 2), 2) * 3;
          html += '<div class="rib" style="left:' + (-W / 2) + "px;top:" + (-H / 2) + "px;width:" + W + "px;height:" + H + "px;transform:translateZ(" + (-k * STEP / 2) + "px) rotateZ(" + rot.toFixed(2) + 'deg)"></div>';
        }
        ORDER.forEach(function (ev, i) {
          var left = i % 2 === 0, x = (left ? -1 : 1) * (W / 2 - (small ? 130 : 180)), z = -(i + 1) * STEP - 640;
          html += '<div class="frame ' + (ev.outcome === "loss" ? "loss" : "") + '" data-f="' + i + '" style="transform:translate3d(' + x + "px,0," + z + "px) rotateY(" + (left ? 50 : -50) + 'deg)">' +
            '<canvas width="368" height="370"></canvas><b></b><span></span></div>';
        });
        $("scene").innerHTML = html;
        [].forEach.call(document.querySelectorAll(".frame canvas"), function (cv, n) { paint(cv, ORDER[n], n); });
        $("track").style.height = (ORDER.length + 1) * 100 + 100 + "vh";
      }

      function fillText() {
        var t = UI[lang];
        document.documentElement.lang = t.lang;
        document.title = t.title;
        $("mark").textContent = t.mark;
        $("iTitle").textContent = t.title;
        $("iEn").textContent = t.en;
        $("iHint").textContent = t.hint;
        [].forEach.call($("lang").children, function (b) { b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"); });
        [].forEach.call(document.querySelectorAll(".frame"), function (f) {
          var e = ORDER[Number(f.dataset.f)];
          f.querySelector("b").textContent = e[lang].amount;
          f.querySelector("span").textContent = sortDate(e).slice(0, 4) + " · " + e[lang].short;
        });
        $("skins").innerHTML = [["a", "A 暗房"], ["b", "B 霓虹"], ["c", "C 宣纸"]].map(function (x) {
          var q = new URLSearchParams(location.search); q.set("style", x[0]);
          return '<a href="?' + q.toString() + location.hash + '" aria-current="' + (x[0] === SKIN) + '">' + x[1] + "</a>";
        }).join("");
        typeLine();
        cur = -2;
        onScroll();
      }

      function typeLine() {
        clearTimeout(typeTimer);
        var lines = UI[lang].typed, li = 0, ch = 0, el = $("iTyped");
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = lines[0]; return; }
        (function tick() {
          var text = lines[li];
          el.textContent = text.slice(0, ch);
          if (ch < text.length) { ch++; typeTimer = setTimeout(tick, 70); }
          else { typeTimer = setTimeout(function () { ch = 0; li = (li + 1) % lines.length; tick(); }, 1700); }
        })();
      }

      function panelHtml(e) {
        var l = e[lang], t = UI[lang];
        var src = e.sources.map(function (s) {
          return '<a href="' + esc(encodeURI(s.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(s.name) + " ↗</a>";
        }).join("");
        return '<div class="p-amt ' + (e.outcome === "loss" ? "loss" : "") + '">' + esc(l.amount) + "</div>" +
          "<h2>" + esc(l.title) + "</h2>" +
          '<div class="p-note">' + esc(l.amount_note) + "</div>" +
          '<div class="p-meta"><span>' + esc(dateLine(e)) + '</span><em class="' + (e.ai_evidence === "unknown" ? "none" : "") + '">' + esc(t.ev[e.ai_evidence]) + "</em></div>" +
          '<div class="p-human"><b>' + esc(t.human) + "</b>" + esc(l.human_role) + "</div>" +
          "<details><summary>" + esc(t.more) + "</summary><p>" + esc(l.summary) + "</p><ol>" +
            l.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol><p><b>" + esc(l.takeaway_label) + "</b> " + esc(l.takeaway) + "</p></details>" +
          '<div class="p-src">' + src + "</div>";
      }

      function dwell(raw) {
        var i = Math.floor(raw), t = raw - i;
        if (t <= 0.24) return i;
        if (t >= 0.76) return i + 1;
        var u = (t - 0.24) / 0.52;
        return i + u * u * (3 - 2 * u);
      }

      function onScroll() {
        var vh = window.innerHeight, raw = window.scrollY / vh - 1, n = ORDER.length;
        var pos = dwell(Math.max(-1, raw)), p = Math.max(0, Math.min(1, pos / (n - 1)));
        $("scene").style.transform = "translateZ(" + (pos + 1) * STEP + "px)";

        var fade = Math.max(0, Math.min(1, (-0.7 - raw) / 0.3));
        $("intro").style.opacity = fade;
        $("intro").hidden = fade === 0;

        /* 走过的展品淡出，不和信息卡叠在一起 */
        [].forEach.call(document.querySelectorAll(".frame"), function (f) {
          var past = pos - Number(f.dataset.f);
          f.style.opacity = Math.max(0, Math.min(1, 1 - (past - 0.12) / 0.4));
        });

        var i = Math.round(pos), inside = i >= 0 && i < n, dist = Math.abs(pos - i);
        var panel = $("panel"), show = inside ? Math.max(0, 1 - dist / 0.16) : 0;
        panel.style.opacity = show;
        panel.classList.toggle("on", show > 0.5);
        var want = inside ? i : -1;
        if (want !== cur) {
          cur = want;
          if (inside) {
            panel.innerHTML = panelHtml(ORDER[i]);
            panel.scrollTop = 0;
            panel.classList.toggle("flip", i % 2 === 1);
          }
          history.replaceState(null, "", location.pathname + location.search + (inside ? "#" + ORDER[i].id : ""));
          [].forEach.call($("skins").children, function (a) { a.hash = inside ? ORDER[i].id : ""; });
        }
        var idx = Math.max(0, Math.min(n - 1, i));
        $("label").innerHTML = raw < -0.6 ? "" : "<b>" + esc(sortDate(ORDER[idx]).slice(0, 4)) + "</b>" + String(idx + 1).padStart(2, "0") + " / " + n;
        $("prev").disabled = raw <= -0.9;
        $("next").disabled = raw >= n - 1.05;
      }

      function jump(i) {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        window.scrollTo({ top: (i + 1) * window.innerHeight, behavior: reduce ? "auto" : "smooth" });
      }
      function nowIndex() { return Math.round(window.scrollY / window.innerHeight - 1); }

      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", function () { build(); fillText(); });
      $("prev").addEventListener("click", function () { jump(Math.max(-1, nowIndex() - 1)); });
      $("next").addEventListener("click", function () { jump(Math.min(ORDER.length - 1, nowIndex() + 1)); });
      $("mark").addEventListener("click", function () { jump(-1); });
      document.addEventListener("keydown", function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); jump(Math.min(ORDER.length - 1, nowIndex() + 1)); }
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); jump(Math.max(-1, nowIndex() - 1)); }
      });
      $("lang").addEventListener("click", function (e) {
        var v = e.target.dataset.lang;
        if (!v) return;
        lang = v;
        try { localStorage.setItem("aisec-lang", v); } catch (err) {}
        fillText();
      });

      fetch("data/events.json")
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          ORDER = d.events.slice().sort(function (a, b) {
            var x = sortDate(a), y = sortDate(b);
            return x === y ? (a.disclosed < b.disclosed ? -1 : 1) : x < y ? -1 : 1;
          });
          var h = decodeURIComponent(location.hash.slice(1));
          var at = ORDER.map(function (e) { return e.id; }).indexOf(h);
          build();
          fillText();
          if (at >= 0) window.scrollTo(0, (at + 1) * window.innerHeight);
          onScroll();
        })
        .catch(function () {
          var p = document.createElement("p");
          p.className = "error";
          p.textContent = "Could not load data/events.json. Open this page through a web server.";
          document.body.appendChild(p);
        });
    </script>
  </body>
</html>
