name: Scout candidate events

# Every Monday 09:00 UTC+8, scan news feeds and open an issue listing
# candidate events. It never changes data/events.json; a person checks each
# candidate and adds it through a normal pull request.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to scan
        default: "8"

permissions:
  contents: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/scout.py --issue --days "${{ github.event.inputs.days || '8' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
